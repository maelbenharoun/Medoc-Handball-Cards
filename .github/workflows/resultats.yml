name: resultats
# Scores et horaires des matchs à parier, lus sur ffhandball.fr (scripts/resultats_ffhb.py) : lundi et jeudi à 3 h 17 UTC.
# Le serveur relit data/matchs.json à 5 h et 7 h UTC et paie les paris gagnants (pg_cron, supabase/schema.sql).
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:
concurrency:
  group: resultats
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  resultats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scores FFHB
        run: python3 scripts/resultats_ffhb.py
      - name: Enregistrer
        run: |
          git config user.name "resultats-ffhb"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matchs.json
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -qm "Résultats FFHB : scores et horaires des matchs à parier"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
