<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Médoc Hand Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>
<header class="top">
  <div class="brand"><img src="assets/logo.png" alt=""><span>Médoc <b>Hand Cards</b></span></div>
  <div class="haut-d"><button class="quetes-b" id="quetes-b" data-act="quetes" aria-label="Quêtes du jour" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9.5l3 3v14H6z M15.5 3.5v3h3 M9 10.5l1.6 1.6 3-3.2 M9 16h6"/></svg><b class="pastille" id="pastille-q" hidden></b></button>
    <div class="coins" id="coins" aria-label="Pièces" hidden><i class="coin"></i><b id="coinv">0</b></div>
  <button class="moi" id="moi" data-act="moi" aria-label="Mon compte" hidden></button></div>
</header>

<main id="view"><p class="sub">Chargement…</p></main>

<nav class="tabs" aria-label="Navigation" hidden>
  <a href="#accueil" data-tab="accueil"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 13h-13z M8 7a4 4 0 0 1 8 0"/></svg>Accueil<b class="pastille" id="pastille" hidden></b></a>
  <a href="#club" data-tab="club"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="9" rx="1.5"/><rect x="14" y="4" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/></svg>Club</a>
  <a href="#equipe" data-tab="equipe"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="1.5"/><path d="M3.5 12h17 M9 4a3 3 0 0 0 6 0 M9 20a3 3 0 0 1 6 0"/></svg>Équipe</a>
  <a href="#jouer" data-tab="jouer"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>Jouer</a>
  <a href="#social" data-tab="social"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><circle cx="16.5" cy="10" r="2.6"/><path d="M3.5 19c.6-3.4 3-5 5.5-5s4.9 1.6 5.5 5 M14.5 15.2c2.6-.4 5 .9 5.8 3.8"/></svg>Social</a>
</nav>

<!-- ami(e)s : la bulle en bas à droite, sur tous les écrans sauf les mini-jeux -->
<button class="bulle-amis" id="bulle-amis" data-act="amis" aria-label="Ami(e)s" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><circle cx="16.5" cy="10" r="2.6"/>
  <path d="M3.5 19c.6-3.4 3-5 5.5-5s4.9 1.6 5.5 5 M14.5 15.2c2.6-.4 5 .9 5.8 3.8"/></svg><b class="pastille" id="pastille-a" hidden></b></button>
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- three.js (mini-jeux en 3D) : version fixée, chargée seulement à l'ouverture d'un mini-jeu -->
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script src="config.js?v=41"></script>
<script src="cartes.js?v=41"></script>
<script src="serveur.js?v=41"></script>
<script src="sons.js?v=41"></script>
<script src="app.js?v=41"></script>
</body>
</html>
